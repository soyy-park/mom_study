<script>
    (function initQuizSetupInteractions() {
      let selectedGrade = 'all';
      let selectedSemester = 'all';
      let selectedExam = 'all';
      let selectedSubject = '전체';
      let selectedCount = 20;

      const summaryText = document.getElementById('summaryText');
      const subSummaryText = document.getElementById('subSummaryText');
      const startBtnLabel = document.getElementById('startBtnLabel');

      function updateSummary() {
        const gradeLabel = selectedGrade === 'all' ? '전체 학년' : selectedGrade + '학년';
        const semLabel = selectedSemester === 'all' ? '전체 학기' : (selectedSemester === 'sem1' ? '1학기' : '2학기');
        const examLabel = selectedExam === 'all' ? '전체 시험' : (selectedExam === 'mid' ? '중간고사' : '기말고사');
        const subjectLabel = selectedSubject === '전체' ? '전체 과목' : selectedSubject;

        summaryText.textContent = `${gradeLabel} · ${semLabel} · ${examLabel} · ${subjectLabel}`;
        
        let poolSize = 89;
        if (selectedSubject === '사회복지개론') poolSize = 24;
        else if (selectedSubject === '인간행동과사회환경') poolSize = 18;
        else if (selectedSubject === '정보처리기사') poolSize = 32;
        else if (selectedSubject === '데이터베이스기초') poolSize = 15;

        const effectiveCount = Math.min(selectedCount, poolSize);
        subSummaryText.innerHTML = `선택 조건에 해당하는 <strong>${poolSize}문제</strong> 중 <strong class="text-primary">${effectiveCount}문제</strong>를 무작위로 추출하여 준비합니다.`;
        startBtnLabel.textContent = `랜덤 퀴즈 시작하기 (${effectiveCount}문항)`;
      }

      function setupGroup(containerId, activeClass, inactiveClass, onSelect) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const buttons = container.querySelectorAll('button');
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            buttons.forEach(b => {
              b.className = b.className.replace(activeClass, '').trim();
              if (!b.className.includes(inactiveClass)) {
                b.className += ' ' + inactiveClass;
              }
              const icon = b.querySelector('.material-symbols-outlined');
              if (icon && icon.textContent === 'done') {
                icon.remove();
              }
            });
            btn.className = btn.className.replace(inactiveClass, '').trim() + ' ' + activeClass;
            const val = btn.getAttribute('data-value') || btn.getAttribute('data-name') || btn.getAttribute('data-count');
            onSelect(val, btn);
            updateSummary();
          });
        });
      }

      // 1. Grade Filter
      setupGroup(
        'gradeFilterGroup',
        'bg-primary-container text-on-primary font-bold shadow-md',
        'bg-surface-container text-on-surface-variant hover:bg-surface-container-high font-medium shadow-sm',
        (val) => { selectedGrade = val; }
      );

      // 2. Semester Filter
      setupGroup(
        'semesterFilterGroup',
        'bg-primary-container text-on-primary font-bold shadow-md',
        'bg-surface-container text-on-surface-variant hover:bg-surface-container-high font-medium shadow-sm',
        (val) => { selectedSemester = val; }
      );

      // 3. Exam Filter
      setupGroup(
        'examFilterGroup',
        'bg-primary-container text-on-primary font-bold shadow-md',
        'bg-surface-container text-on-surface-variant hover:bg-surface-container-high font-medium shadow-sm',
        (val) => { selectedExam = val; }
      );

      // 4. Subject Filter
      setupGroup(
        'subjectFilterGroup',
        'bg-secondary text-on-secondary font-semibold shadow-sm',
        'bg-surface-container text-on-surface hover:bg-surface-container-high font-medium shadow-sm',
        (val) => { selectedSubject = val; }
      );

      // 5. Question Count Cards
      const countGroup = document.getElementById('countCardGroup');
      if (countGroup) {
        const cards = countGroup.querySelectorAll('.count-card');
        cards.forEach(card => {
          card.addEventListener('click', () => {
            cards.forEach(c => {
              c.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-xl');
              c.classList.add('bg-surface-container', 'hover:bg-surface-container-high', 'shadow-sm');
              const title = c.querySelector('span.font-headline-lg');
              if (title) {
                title.classList.remove('text-on-primary');
                title.classList.add('text-on-surface');
              }
              const desc = c.querySelectorAll('span.font-label-md, span.font-label-sm');
              desc.forEach(d => {
                d.classList.remove('text-on-primary', 'text-on-primary-container');
                d.classList.add('text-on-surface-variant');
              });
            });

            card.classList.remove('bg-surface-container', 'hover:bg-surface-container-high', 'shadow-sm');
            card.classList.add('bg-primary-container', 'text-on-primary', 'shadow-xl');
            const title = card.querySelector('span.font-headline-lg');
            if (title) {
              title.classList.remove('text-on-surface');
              title.classList.add('text-on-primary');
            }
            const descMd = card.querySelector('span.font-label-md');
            if (descMd) {
              descMd.classList.remove('text-on-surface-variant');
              descMd.classList.add('text-on-primary');
            }
            const descSm = card.querySelector('span.font-label-sm');
            if (descSm && !descSm.classList.contains('bg-surface-container-lowest')) {
              descSm.classList.remove('text-on-surface-variant');
              descSm.classList.add('text-on-primary-container');
            }

            selectedCount = parseInt(card.getAttribute('data-count'), 10);
            updateSummary();
          });
        });
      }

      // Reset Button Behavior
      const resetBtn = document.getElementById('resetAllBtn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          document.querySelectorAll('#gradeFilterGroup button, #semesterFilterGroup button, #examFilterGroup button').forEach(btn => {
            if (btn.getAttribute('data-value') === 'all') {
              btn.click();
            }
          });
          const allSubjectBtn = document.querySelector('#subjectFilterGroup button[data-name="전체"]');
          if (allSubjectBtn) allSubjectBtn.click();
          const defaultCountBtn = document.querySelector('#countCardGroup button[data-count="20"]');
          if (defaultCountBtn) defaultCountBtn.click();
        });
      }

      // Select All Subjects shortcut
      const selectAllSubjects = document.getElementById('selectAllSubjects');
      if (selectAllSubjects) {
        selectAllSubjects.addEventListener('click', () => {
          const allSubjectBtn = document.querySelector('#subjectFilterGroup button[data-name="전체"]');
          if (allSubjectBtn) allSubjectBtn.click();
        });
      }

      // Set initial summary
      updateSummary();
    })();
